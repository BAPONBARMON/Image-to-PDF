<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image → PDF + Exact Compressor</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- pdf.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --neon:#00ff7f;
  --soft:#00ff7f55;
  --bg:#000;
}
*{box-sizing:border-box;font-family:Consolas,"Fira Code",monospace}

body{
  margin:0;
  min-height:100vh;
  background:
    repeating-linear-gradient(
      0deg,
      #000 0,
      #000 2px,
      #001a0a 3px
    );
  color:var(--neon);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:12px;
}

.panel{
  width:100%;
  max-width:860px;
  background:radial-gradient(circle at top,#021a0a,#000);
  border:1px solid var(--neon);
  border-radius:16px;
  padding:16px;
  box-shadow:
    0 0 20px #00ff7f55,
    inset 0 0 12px #00ff7f22;
  animation:pulse 4s infinite;
}

@keyframes pulse{
  0%,100%{box-shadow:0 0 16px #00ff7f55}
  50%{box-shadow:0 0 28px #00ff7faa}
}

h1{
  text-align:center;
  margin:6px 0 14px;
  letter-spacing:.25em;
  text-transform:uppercase;
  text-shadow:0 0 12px var(--neon);
}

input,button,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#000;
  border:1px solid var(--soft);
  border-radius:8px;
  color:var(--neon);
}

button{
  background:linear-gradient(180deg,#002b16,#001a0d);
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  box-shadow:0 0 12px var(--neon);
}

.spinner{
  display:none;
  width:46px;height:46px;
  margin:14px auto;
  border:3px solid #003820;
  border-top:3px solid var(--neon);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

a{
  display:none;
  margin-top:10px;
  padding:12px;
  background:#001a0d;
  border:1px solid var(--soft);
  color:var(--neon);
  text-decoration:none;
  text-align:center;
  border-radius:8px;
}

/* POPUP */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#000d;
  backdrop-filter:blur(6px);
  justify-content:center;
  align-items:center;
  z-index:99;
}
.popup{
  width:90%;
  max-width:420px;
  background:#000;
  border:1px solid var(--neon);
  border-radius:14px;
  padding:16px;
  box-shadow:0 0 30px var(--neon);
}
</style>
</head>

<body>

<div class="panel">
<h1>IMAGE → PDF</h1>

<input type="file" id="imgInput" multiple accept="image/*">
<button id="genPdf">▶ Generate PDF</button>
<div class="spinner" id="genSpin"></div>

<div id="details" style="display:none">
  <div class="row">
    <span>Active PDF Size</span>
    <span id="sizeText">0 KB</span>
  </div>

  <button id="wantCompress">⚡ Want Compress?</button>

  <input id="rename" placeholder="Rename PDF (optional)">
  <a id="download">⬇ Download PDF</a>
</div>
</div>

<!-- COMPRESS POPUP -->
<div class="overlay" id="overlay">
<div class="popup">
<h3 style="text-align:center">PDF COMPRESSOR</h3>

<div class="spinner" id="cmpSpin"></div>

<div id="cmpForm">
  <p>Current Size: <b id="popCur">0 KB</b></p>
  <input id="targetKB" type="number" placeholder="Target size (KB)">
  <button id="doCompress">Compress</button>

  <p id="newInfo" style="display:none">
    New Size: <b id="newSize"></b>
  </p>

  <button id="done" style="display:none">Done</button>
  <button onclick="overlay.style.display='none'">Cancel</button>
</div>
</div>
</div>

<script>
const { jsPDF } = window.jspdf;

const imgInput = document.getElementById("imgInput");
const genPdf = document.getElementById("genPdf");
const genSpin = document.getElementById("genSpin");

const details = document.getElementById("details");
const sizeText = document.getElementById("sizeText");
const download = document.getElementById("download");
const rename = document.getElementById("rename");
const wantCompress = document.getElementById("wantCompress");

const overlay = document.getElementById("overlay");
const cmpSpin = document.getElementById("cmpSpin");
const popCur = document.getElementById("popCur");
const targetKB = document.getElementById("targetKB");
const doCompress = document.getElementById("doCompress");
const newInfo = document.getElementById("newInfo");
const newSize = document.getElementById("newSize");
const done = document.getElementById("done");

let activeBlob = null;

/* IMAGE → PDF */
genPdf.onclick = ()=>{
  if(!imgInput.files.length) return alert("Select images");
  genSpin.style.display="block";

  setTimeout(async()=>{
    const pdf=new jsPDF("p","mm","a4");
    const w=pdf.internal.pageSize.getWidth();
    const h=pdf.internal.pageSize.getHeight();

    for(let i=0;i<imgInput.files.length;i++){
      const img=await load(await toBase64(imgInput.files[i]));
      const s=Math.min((w*0.9)/img.width,(h*0.9)/img.height);
      if(i) pdf.addPage();
      pdf.addImage(img,"JPEG",(w-img.width*s)/2,(h-img.height*s)/2,img.width*s,img.height*s);
    }

    activeBlob=pdf.output("blob");
    updateMain();
    genSpin.style.display="none";
  },1500);
};

function updateMain(){
  sizeText.textContent=(activeBlob.size/1024).toFixed(1)+" KB";
  download.href=URL.createObjectURL(activeBlob);
  download.download=(rename.value.trim()||"converted")+".pdf";
  download.style.display="block";
  details.style.display="block";
}

/* WANT COMPRESS */
wantCompress.onclick=()=>{
  overlay.style.display="flex";
  cmpSpin.style.display="block";
  popCur.textContent=(activeBlob.size/1024).toFixed(1)+" KB";
  newInfo.style.display="none";
  done.style.display="none";
  setTimeout(()=>cmpSpin.style.display="none",1500);
};

/* EXACT TARGET COMPRESS */
doCompress.onclick=async()=>{
  const target = Number(targetKB.value);
  if(!target || target<10) return alert("Enter valid target KB");

  cmpSpin.style.display="block";

  const buf = await activeBlob.arrayBuffer();
  const pdfDoc = await pdfjsLib.getDocument({data:buf}).promise;

  let low=0.2, high=1.0;
  let bestBlob=null, bestDiff=Infinity;
  const targetBytes = target*1024;

  for(let i=0;i<6;i++){
    const q=(low+high)/2;
    const doc=new jsPDF();
    for(let p=1;p<=pdfDoc.numPages;p++){
      const page=await pdfDoc.getPage(p);
      const vp=page.getViewport({scale:1.5});
      const c=document.createElement("canvas");
      c.width=vp.width; c.height=vp.height;
      await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
      const img=c.toDataURL("image/jpeg",q);
      if(p>1) doc.addPage([vp.width,vp.height]);
      doc.addImage(img,"JPEG",0,0,vp.width,vp.height);
    }

    const blob=doc.output("blob");
    const diff=Math.abs(blob.size-targetBytes);

    if(diff<bestDiff){
      bestDiff=diff;
      bestBlob=blob;
    }

    if(blob.size>targetBytes) high=q;
    else low=q;
  }

  activeBlob=bestBlob;
  newSize.textContent=(activeBlob.size/1024).toFixed(1)+" KB";
  newInfo.style.display="block";
  done.style.display="block";
  cmpSpin.style.display="none";
};

/* DONE */
done.onclick=()=>{
  updateMain();
  overlay.style.display="none";
};

/* helpers */
const toBase64=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
</script>

</body>
</html>
