<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image → PDF (A4 Safe + Real Compress)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- pdf.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{--neon:#00ff7f;--soft:#00ff7f55}
*{box-sizing:border-box;font-family:Consolas,monospace}

body{
margin:0;min-height:100vh;
background:radial-gradient(circle at top,#00200f 0,#000 55%);
color:var(--neon);
display:flex;justify-content:center;align-items:center;
padding:12px;
}

.panel{
width:100%;max-width:860px;
background:#020502;border:1px solid var(--neon);
border-radius:16px;padding:16px;
box-shadow:0 0 20px #00ff7f55;
}

h1{text-align:center;text-shadow:0 0 12px var(--neon)}

input,button{
width:100%;padding:12px;margin-top:10px;
background:#000;border:1px solid var(--soft);
border-radius:8px;color:var(--neon)
}

button{
background:#001a0d;font-weight:bold;cursor:pointer
}
button:hover{box-shadow:0 0 12px var(--neon)}

.spinner{
display:none;width:46px;height:46px;
margin:14px auto;
border:3px solid #003820;border-top:3px solid var(--neon);
border-radius:50%;animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

.row{display:flex;justify-content:space-between;margin:8px 0}

a{
display:none;margin-top:10px;padding:12px;
background:#001a0d;border:1px solid var(--soft);
color:var(--neon);text-decoration:none;
text-align:center;border-radius:8px
}

/* popup */
.overlay{
display:none;position:fixed;inset:0;
background:#000d;backdrop-filter:blur(6px);
justify-content:center;align-items:center;z-index:99
}
.popup{
width:90%;max-width:420px;background:#000;
border:1px solid var(--neon);
border-radius:14px;padding:16px;
box-shadow:0 0 30px var(--neon)
}
</style>
</head>

<body>

<div class="panel">
<h1>IMAGE → PDF</h1>

<input type="file" id="imgInput" multiple accept="image/*">
<button id="genPdf">▶ Generate PDF</button>
<div class="spinner" id="genSpin"></div>

<div id="details" style="display:none">
  <div class="row">
    <span>Active PDF Size</span>
    <span id="sizeText">0 KB</span>
  </div>

  <button id="wantCompress">⚡ Want Compress?</button>

  <!-- RENAME (always latest) -->
  <input id="rename" placeholder="Rename PDF (optional)">

  <a id="download">⬇ Download PDF</a>
</div>
</div>

<!-- COMPRESS POPUP -->
<div class="overlay" id="overlay">
<div class="popup">
<h3 style="text-align:center">PDF COMPRESSOR</h3>
<div class="spinner" id="cmpSpin"></div>

<p>Current Size: <b id="popCur">0 KB</b></p>
<input id="targetKB" type="number" placeholder="Target size (KB)">
<button id="doCompress">Compress</button>

<p id="newInfo" style="display:none">
New Size: <b id="newSize"></b>
</p>

<button id="done" style="display:none">Done</button>
<button onclick="overlay.style.display='none'">Cancel</button>
</div>
</div>

<script>
const { jsPDF } = window.jspdf;

const imgInput = document.getElementById("imgInput");
const genPdf = document.getElementById("genPdf");
const genSpin = document.getElementById("genSpin");
const sizeText = document.getElementById("sizeText");
const download = document.getElementById("download");
const rename = document.getElementById("rename");
const wantCompress = document.getElementById("wantCompress");

const overlay = document.getElementById("overlay");
const cmpSpin = document.getElementById("cmpSpin");
const popCur = document.getElementById("popCur");
const targetKB = document.getElementById("targetKB");
const doCompress = document.getElementById("doCompress");
const newInfo = document.getElementById("newInfo");
const newSize = document.getElementById("newSize");
const done = document.getElementById("done");

let activeBlob=null;

/* A4 constants */
const PAGE_W = 210;
const PAGE_H = 297;
const MARGIN = 12;

/* IMAGE → PDF (MAX 100) */
genPdf.onclick=()=>{
  if(!imgInput.files.length) return alert("Select images");
  if(imgInput.files.length>100) return alert("Max 100 images allowed");

  genSpin.style.display="block";

  setTimeout(async()=>{
    const pdf=new jsPDF("p","mm","a4");

    for(let i=0;i<imgInput.files.length;i++){
      const img=await load(await toBase64(imgInput.files[i]));
      if(i) pdf.addPage();

      const maxW = PAGE_W - MARGIN*2;
      const maxH = PAGE_H - MARGIN*2;
      const scale = Math.min(maxW/img.width, maxH/img.height);

      const w = img.width*scale;
      const h = img.height*scale;
      const x = (PAGE_W - w)/2;
      const y = (PAGE_H - h)/2;

      pdf.addImage(img,"JPEG",x,y,w,h);
    }

    activeBlob=pdf.output("blob");
    updateMain();
    genSpin.style.display="none";
  },1500);
};

function updateMain(){
  sizeText.textContent=(activeBlob.size/1024).toFixed(1)+" KB";
  download.href=URL.createObjectURL(activeBlob);
  download.style.display="block";
  document.getElementById("details").style.display="block";
}

/* ALWAYS USE LATEST RENAME */
download.addEventListener("click",()=>{
  const name = rename.value.trim() || "converted";
  download.download = name + ".pdf";
});

/* WANT COMPRESS */
wantCompress.onclick=()=>{
  overlay.style.display="flex";
  popCur.textContent=(activeBlob.size/1024).toFixed(1)+" KB";
  newInfo.style.display="none";
  done.style.display="none";
};

/* REAL A4 SAFE COMPRESS */
doCompress.onclick=async()=>{
  const target = Number(targetKB.value);
  if(!target || target<10) return alert("Enter target size");

  cmpSpin.style.display="block";

  const buf = await activeBlob.arrayBuffer();
  const pdfDoc = await pdfjsLib.getDocument({data:buf}).promise;

  let low=0.25, high=0.95;
  let bestBlob=null, bestDiff=Infinity;
  const targetBytes = target*1024;

  for(let t=0;t<6;t++){
    const q=(low+high)/2;
    const pdf=new jsPDF("p","mm","a4");

    for(let p=1;p<=pdfDoc.numPages;p++){
      const page=await pdfDoc.getPage(p);
      const vp=page.getViewport({scale:1.5});
      const c=document.createElement("canvas");
      c.width=vp.width; c.height=vp.height;
      await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;

      const img=c.toDataURL("image/jpeg",q);
      if(p>1) pdf.addPage();

      const maxW = PAGE_W - MARGIN*2;
      const maxH = PAGE_H - MARGIN*2;
      const scale = Math.min(maxW/vp.width, maxH/vp.height);
      const w = vp.width*scale;
      const h = vp.height*scale;
      const x = (PAGE_W - w)/2;
      const y = (PAGE_H - h)/2;

      pdf.addImage(img,"JPEG",x,y,w,h);
    }

    const blob=pdf.output("blob");
    const diff=Math.abs(blob.size-targetBytes);

    if(diff<bestDiff){
      bestDiff=diff;
      bestBlob=blob;
    }

    if(blob.size>targetBytes) high=q;
    else low=q;
  }

  activeBlob=bestBlob;
  newSize.textContent=(activeBlob.size/1024).toFixed(1)+" KB";
  newInfo.style.display="block";
  done.style.display="block";
  cmpSpin.style.display="none";
};

/* DONE */
done.onclick=()=>{
  updateMain();
  overlay.style.display="none";
};

/* helpers */
const toBase64=f=>new Promise(r=>{
  const fr=new FileReader();
  fr.onload=()=>r(fr.result);
  fr.readAsDataURL(f);
});
const load=s=>new Promise(r=>{
  const i=new Image();
  i.onload=()=>r(i);
  i.src=s;
});
</script>

</body>
</html>
