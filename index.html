<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image → PDF</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- pdf.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
</script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --neon:#00ff7f;
  --soft:#00ff7f55;
}
*{box-sizing:border-box;font-family:Consolas,"Fira Code",monospace}

body{
  margin:0;
  min-height:100vh;
  background:#000;
  color:var(--neon);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:14px;
}

/* ===== PANEL ===== */
.panel{
  width:100%;
  max-width:860px;
  background:#000;
  border:1px solid var(--neon);
  border-radius:16px;
  padding:18px;
  box-shadow:0 0 20px #00ff7f55;
}

h1{
  text-align:center;
  font-size:1.1rem;
  letter-spacing:.32em;
  text-shadow:0 0 14px var(--neon);
}

/* ===== INPUTS ===== */
input,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  background:#000;
  border:1px solid var(--soft);
  border-radius:8px;
  color:var(--neon);
  font-size:1rem;
}

/* file input */
input[type="file"]::file-selector-button{
  background:#00ff7f;
  color:#000;
  border:none;
  border-radius:6px;
  padding:6px 10px;
  margin-right:12px;
  font-weight:bold;
}

/* button */
button{
  background:#001a0d;
  font-weight:bold;
  letter-spacing:.12em;
  cursor:pointer;
}
button:hover{
  box-shadow:0 0 16px var(--neon);
}

/* ===== SPINNER ===== */
.spinner{
  display:none;
  width:48px;
  height:48px;
  margin:18px auto;
  border:4px solid #003820;
  border-top:4px solid var(--neon);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== DETAILS ===== */
.row{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
  font-size:1rem;
}

a{
  display:none;
  margin-top:14px;
  padding:14px;
  background:#000;
  border:1px solid var(--neon);
  color:var(--neon);
  text-decoration:none;
  text-align:center;
  border-radius:8px;
  font-size:1rem;
}

/* ===== POPUP ===== */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#000e;
  backdrop-filter:blur(6px);
  justify-content:center;
  align-items:center;
  z-index:99;
}
.popup{
  width:92%;
  max-width:420px;
  background:#000;
  border:1px solid var(--neon);
  border-radius:14px;
  padding:20px;
  box-shadow:0 0 28px var(--neon);
  font-size:1rem;
}

/* ===== MOBILE BOOST ===== */
@media(max-width:600px){
  body{padding:18px}
  .panel{padding:20px}
  h1{font-size:1.2rem}
  input,button,a{font-size:1.05rem;padding:16px}
}
</style>
</head>

<body>

<div class="panel">
<h1>IMAGE → PDF</h1>

<input type="file" id="imgInput" multiple accept="image/*">
<button id="genPdf">GENERATE PDF</button>
<div class="spinner" id="genSpin"></div>

<div id="details" style="display:none">
  <div class="row">
    <span>PDF SIZE</span>
    <span id="sizeText">0 KB</span>
  </div>

  <button id="wantCompress">Want compress PDF ?</button>
  <input id="rename" placeholder="RENAME PDF (OPTIONAL)">
  <a id="download">DOWNLOAD PDF</a>
</div>
</div>

<!-- ===== COMPRESS POPUP ===== -->
<div class="overlay" id="overlay">
<div class="popup">
<h3 style="text-align:center">PDF COMPRESSOR</h3>

<div class="spinner" id="cmpSpin"></div>

<p>CURRENT SIZE: <b id="popCur"></b></p>
<input id="targetKB" type="number" placeholder="TARGET SIZE (KB)">
<button id="doCompress">COMPRESS</button>

<p id="newInfo" style="display:none">
NEW SIZE: <b id="newSize"></b>
</p>

<button id="done" style="display:none">DONE</button>
<button onclick="overlay.style.display='none'">CANCEL</button>
</div>
</div>

<script>
const { jsPDF } = window.jspdf;

const imgInput=document.getElementById("imgInput");
const genPdf=document.getElementById("genPdf");
const genSpin=document.getElementById("genSpin");
const sizeText=document.getElementById("sizeText");
const download=document.getElementById("download");
const rename=document.getElementById("rename");
const wantCompress=document.getElementById("wantCompress");

const overlay=document.getElementById("overlay");
const cmpSpin=document.getElementById("cmpSpin");
const popCur=document.getElementById("popCur");
const targetKB=document.getElementById("targetKB");
const doCompress=document.getElementById("doCompress");
const newInfo=document.getElementById("newInfo");
const newSize=document.getElementById("newSize");
const done=document.getElementById("done");

let activeBlob=null;

/* ===== SINGLE MARGIN SOURCE ===== */
const PAGE_W=210;
const PAGE_H=297;
const MARGIN=8; // 🔥 SAME for normal & compress

/* ===== IMAGE → PDF ===== */
genPdf.onclick=()=>{
  if(!imgInput.files.length) return alert("Select images");
  if(imgInput.files.length>100) return alert("Max 100 images");

  genSpin.style.display="block";
  setTimeout(async()=>{
    const pdf=new jsPDF("p","mm","a4");

    for(let i=0;i<imgInput.files.length;i++){
      const img=await load(await toBase64(imgInput.files[i]));
      if(i) pdf.addPage();

      const maxW=PAGE_W-MARGIN*2;
      const maxH=PAGE_H-MARGIN*2;
      const s=Math.min(maxW/img.width,maxH/img.height);

      pdf.addImage(
        img,"JPEG",
        (PAGE_W-img.width*s)/2,
        (PAGE_H-img.height*s)/2,
        img.width*s,img.height*s
      );
    }

    activeBlob=pdf.output("blob");
    updateMain();
    genSpin.style.display="none";
  },1500);
};

function updateMain(){
  sizeText.textContent=(activeBlob.size/1024).toFixed(1)+" KB";
  download.href=URL.createObjectURL(activeBlob);
  download.style.display="block";
  document.getElementById("details").style.display="block";
}

download.addEventListener("click",()=>{
  download.download=(rename.value.trim()||"converted")+".pdf";
});

/* ===== WANT COMPRESS ===== */
wantCompress.onclick=()=>{
  overlay.style.display="flex";
  cmpSpin.style.display="block";
  popCur.textContent=(activeBlob.size/1024).toFixed(1)+" KB";
  newInfo.style.display="none";
  done.style.display="none";
  setTimeout(()=>cmpSpin.style.display="none",1500);
};

/* ===== COMPRESS ===== */
doCompress.onclick=async()=>{
  const target=Number(targetKB.value);
  if(!target||target<10) return alert("Enter target size");

  cmpSpin.style.display="block";
  await new Promise(r=>setTimeout(r,1500));

  const buf=await activeBlob.arrayBuffer();
  const pdfDoc=await pdfjsLib.getDocument({data:buf}).promise;

  let bestBlob=null,bestDiff=Infinity;
  const targetBytes=target*1024;

  let qLow=0.3,qHigh=0.95;
  let scaleLow=1.2,scaleHigh=2.0;

  for(let i=0;i<10;i++){
    const q=(qLow+qHigh)/2;
    const scaleRender=(scaleLow+scaleHigh)/2;
    const pdf=new jsPDF("p","mm","a4");

    for(let p=1;p<=pdfDoc.numPages;p++){
      const page=await pdfDoc.getPage(p);
      const vp=page.getViewport({scale:scaleRender});
      const c=document.createElement("canvas");
      c.width=vp.width;c.height=vp.height;
      await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;

      const img=c.toDataURL("image/jpeg",q);
      if(p>1) pdf.addPage();

      const maxW=PAGE_W-MARGIN*2;
      const maxH=PAGE_H-MARGIN*2;
      const s=Math.min(maxW/vp.width,maxH/vp.height);

      pdf.addImage(
        img,"JPEG",
        (PAGE_W-vp.width*s)/2,
        (PAGE_H-vp.height*s)/2,
        vp.width*s,vp.height*s
      );
    }

    const blob=pdf.output("blob");
    const diff=Math.abs(blob.size-targetBytes);
    if(diff<bestDiff){bestDiff=diff;bestBlob=blob;}
    if(blob.size>targetBytes){qHigh=q;scaleHigh=scaleRender;}
    else{qLow=q;scaleLow=scaleRender;}
  }

  activeBlob=bestBlob;
  newSize.textContent=(activeBlob.size/1024).toFixed(1)+" KB";
  newInfo.style.display="block";
  done.style.display="block";
  cmpSpin.style.display="none";
};

/* DONE */
done.onclick=()=>{
  updateMain();
  overlay.style.display="none";
};

/* helpers */
const toBase64=f=>new Promise(r=>{
  const fr=new FileReader();
  fr.onload=()=>r(fr.result);
  fr.readAsDataURL(f);
});
const load=s=>new Promise(r=>{
  const i=new Image();
  i.onload=()=>r(i);
  i.src=s;
});
</script>

</body>
</html>
