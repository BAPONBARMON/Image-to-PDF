<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BAPON BARMON | Image to PDF</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --bg:#000;
  --panel:#020502;
  --neon:#00ff33;
  --neon-soft:#00ff3366;
  --text-soft:#7dff9c;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:radial-gradient(circle at top,#00200f 0,#000 50%);
  color:var(--neon);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-family:monospace;
  padding:14px;
  overflow-x:hidden;
}

.panel{
  width:100%;
  max-width:820px;
  background:var(--panel);
  border:2px solid var(--neon);
  border-radius:14px;
  padding:16px;
  box-shadow:0 0 20px #00ff3350;
}

.panel-title{
  text-align:center;
  font-size:22px;
  font-weight:700;
  margin-bottom:10px;
  text-shadow:0 0 10px var(--neon);
}

label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
}

input[type="file"],
input[type="text"]{
  width:100%;
  background:#000;
  border:1px solid var(--neon-soft);
  padding:10px;
  border-radius:6px;
  color:var(--text-soft);
  font-size:13px;
}

input::file-selector-button{
  background:#001a09;
  color:var(--neon);
  border:1px solid var(--neon-soft);
  padding:6px 10px;
  border-radius:4px;
  cursor:pointer;
  margin-right:8px;
}

#fileInfo{
  font-size:11px;
  margin:6px 0 10px;
  color:var(--text-soft);
}

.btn{
  width:100%;
  padding:12px;
  background:#001a09;
  border:1px solid var(--neon-soft);
  color:var(--neon);
  border-radius:6px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
  margin-top:12px;
}

.btn:hover{
  background:#003812;
  box-shadow:0 0 10px var(--neon);
}

/* ===== SPINNER ===== */
.spinner{
  display:none;
  margin:16px auto;
  width:46px;
  height:46px;
  border:3px solid #003812;
  border-top:3px solid var(--neon);
  border-radius:50%;
  animation:spin .8s linear infinite, glow 1.5s ease-in-out infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}
@keyframes glow{
  0%,100%{ box-shadow:0 0 6px var(--neon); }
  50%{ box-shadow:0 0 18px var(--neon); }
}

#info{
  display:none;
  margin-top:12px;
  font-size:12px;
  padding:10px;
  background:#000;
  border:1px solid var(--neon-soft);
  border-radius:6px;
  color:var(--text-soft);
  white-space:pre-line;
}

.pdf-details-box{
  margin-top:18px;
  display:none;
  background:#000;
  border:2px solid var(--neon-soft);
  border-radius:10px;
  padding:14px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
}

#downloadLink{
  display:none;
  margin-top:12px;
  padding:12px;
  background:#001a09;
  border:1px solid var(--neon-soft);
  color:var(--neon);
  border-radius:6px;
  text-align:center;
  font-weight:bold;
  text-decoration:none;
}

footer{
  margin-top:16px;
  font-size:12px;
  text-align:center;
  color:var(--text-soft);
}

/* ===== MOBILE PERFECT FIT (0.5mm reduced) ===== */
@media(max-width:600px){
  body{
    padding:12px;
  }
  .panel{
    padding:14px;
  }
  .panel-title{
    font-size:19px;
  }
  .btn{
    font-size:16px;
    padding:14px;
  }
}
</style>
</head>

<body>

<div class="panel">
  <div class="panel-title">Image to PDF Converter</div>

  <label>Select images (max 100)</label>
  <input type="file" id="imageUpload" accept="image/*" multiple>
  <div id="fileInfo">0 files selected</div>

  <button id="convertBtn" class="btn">▶ Generate PDF</button>

  <div class="spinner" id="spinner"></div>

  <pre id="info"></pre>

  <div class="pdf-details-box" id="detailsBox">
    <div class="detail-row"><span>Pages:</span><span id="detailPages">0</span></div>
    <div class="detail-row"><span>File Size:</span><span id="detailSize">0 KB</span></div>
    <div class="detail-row"><span>Images Used:</span><span id="detailImages">0</span></div>
    <div class="detail-row"><span>Created In:</span><span id="detailTime">0 s</span></div>

    <!-- OPTIONAL RENAME -->
    <label style="margin-top:10px;">Rename PDF (Optional)</label>
    <input type="text" id="pdfName" placeholder="my-file-name">

    <a id="downloadLink">⬇ Download PDF</a>
  </div>
</div>

<footer>Powered by <b>BAPON BARMON</b></footer>

<script>
const { jsPDF } = window.jspdf;

const imageUpload=document.getElementById("imageUpload");
const convertBtn=document.getElementById("convertBtn");
const spinner=document.getElementById("spinner");
const info=document.getElementById("info");
const downloadLink=document.getElementById("downloadLink");
const detailsBox=document.getElementById("detailsBox");
const fileInfo=document.getElementById("fileInfo");
const pdfName=document.getElementById("pdfName");

const detailPages=document.getElementById("detailPages");
const detailSize=document.getElementById("detailSize");
const detailImages=document.getElementById("detailImages");
const detailTime=document.getElementById("detailTime");

let files=[], currentUrl=null;

imageUpload.onchange=()=>{
  files=[...imageUpload.files].slice(0,100);
  fileInfo.textContent=`${files.length} file(s) selected`;
  detailsBox.style.display="none";
};

convertBtn.onclick=()=>{
  if(!files.length){
    alert("Please select images first");
    return;
  }
  spinner.style.display="block";
  info.style.display="none";
  setTimeout(generatePDF,1500);
};

async function generatePDF(){
  spinner.style.display="none";
  info.style.display="block";
  info.textContent="Creating PDF...\n";

  const start=performance.now();
  const pdf=new jsPDF("p","mm","a4");
  const w=pdf.internal.pageSize.getWidth();
  const h=pdf.internal.pageSize.getHeight();

  for(let i=0;i<files.length;i++){
    const img=await loadImg(await toBase64(files[i]));
    const s=Math.min((w*0.9)/img.width,(h*0.9)/img.height);
    const iw=img.width*s, ih=img.height*s;
    if(i) pdf.addPage();
    pdf.addImage(img,"JPEG",(w-iw)/2,(h-ih)/2,iw,ih);
    info.textContent+=`Page ${i+1}/${files.length}\n`;
  }

  const blob=pdf.output("blob");
  currentUrl && URL.revokeObjectURL(currentUrl);
  currentUrl=URL.createObjectURL(blob);

  const cleanName = pdfName.value.trim();
  downloadLink.download = (cleanName !== "" ? cleanName : "converted") + ".pdf";
  downloadLink.href=currentUrl;

  detailPages.textContent=files.length;
  detailImages.textContent=files.length;
  detailSize.textContent=(blob.size/1024).toFixed(1)+" KB";
  detailTime.textContent=((performance.now()-start)/1000).toFixed(2)+" s";

  downloadLink.style.display="block";
  detailsBox.style.display="block";
  info.textContent+="\nPDF Ready ✔";
}

const toBase64=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
const loadImg=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
</script>

</body>
</html>
